<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>North Kilworth canal reachability map</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #17212b;
      background: #f5f7f8;
    }

    * { box-sizing: border-box; }

    body { margin: 0; }

    header {
      padding: 18px 22px 14px;
      background: #fff;
      border-bottom: 1px solid #d8e0e5;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.25rem, 3vw, 1.8rem);
    }

    .status {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      margin-top: 12px;
      font-size: .95rem;
    }

    .key { display: inline-flex; align-items: center; gap: 7px; }

    .swatch {
      display: inline-block;
      width: 23px;
      height: 5px;
      border-radius: 4px;
      background: #16834a;
    }

    .swatch.blocked { background: #c62828; }
    .swatch.uncertain { background: #a76b00; }
    .swatch.start { width: 12px; height: 12px; border-radius: 50%; background: #1769aa; }
    .swatch.pub { width: 17px; height: 17px; border-radius: 50%; background: #7b3fb2; }
    .swatch.shop { width: 17px; height: 17px; border-radius: 50%; background: #087e9b; }
    .swatch.visit { width: 17px; height: 17px; border-radius: 50%; background: #d58b00; }

    #map { width: 100%; height: min(72vh, 850px); min-height: 490px; }

    .leaflet-popup-content { line-height: 1.45; }
    .leaflet-tooltip { font-weight: 650; }

    @media (max-width: 600px) {
      header { padding: 14px 15px 11px; }
      #map { height: 66vh; min-height: 430px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>North Kilworth Marina: where the boat can go</h1>
    <div class="status" aria-label="Map legend">
      <span class="key"><span class="swatch"></span>Canal reach shown as navigable between the closures</span>
      <span class="key"><span class="swatch blocked"></span>Not reachable by boat through the closed locks</span>
      <span class="key"><span class="swatch uncertain"></span>Welford Arm: access to the lock unconfirmed</span>
      <span class="key"><span class="swatch start"></span>Pickup and return: North Kilworth Marina</span>
      <span class="key"><span class="swatch pub"></span>Pub / food</span>
      <span class="key"><span class="swatch shop"></span>Shop / garden centre</span>
      <span class="key"><span class="swatch visit"></span>Walk / place to visit</span>
    </div>
  </header>

  <main>
    <div id="map" role="application" aria-label="Map of canal reachability around North Kilworth"></div>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    const map = L.map("map", { scrollWheelZoom: true }).setView([52.445, -1.15], 10);

    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    const reachableStyle = { color: "#16834a", weight: 6, opacity: 0.9 };
    const blockedStyle = { color: "#c62828", weight: 6, opacity: 0.9, dashArray: "10 8" };

    // Reference overlays trace the canal corridor approximately; use the basemap and live notices for detail.
    const reachableSouth = [
      [52.43739, -1.07825], [52.4298, -1.0840], [52.4218, -1.0920],
      [52.4115, -1.1000], [52.3990, -1.1080], [52.3850, -1.1150],
      [52.3700, -1.1220], [52.3570, -1.1300], [52.34846, -1.13717],
      [52.3420, -1.1360], [52.33773, -1.13069], [52.3315, -1.1270],
      [52.3260, -1.1230], [52.3210, -1.1200]
    ];
    const reachableNorth = [
      [52.43739, -1.07825], [52.4405, -1.0770], [52.44505, -1.08021],
      [52.4515, -1.0700], [52.4600, -1.0610], [52.4680, -1.0450],
      [52.4770, -1.0270], [52.4880, -1.0080], [52.4987, -0.9826]
    ];
    const welfordArmApproximate = [
      [52.43739, -1.07825], [52.4340, -1.0740], [52.4300, -1.0695],
      [52.4260, -1.0610], [52.42247, -1.05391]
    ];
    const blockedNorth = [
      [52.4987, -0.9826], [52.5035, -0.9678], [52.4960, -0.9500],
      [52.4860, -0.9340], [52.47771, -0.92086]
    ];
    const blockedSouth = [
      [52.3210, -1.1200], [52.3180, -1.1280], [52.3100, -1.1430],
      [52.3010, -1.1610], [52.2910, -1.1900], [52.2840, -1.2050]
    ];
    const blockedLeicester = [
      [52.4987, -0.9826], [52.5110, -0.9860], [52.5260, -0.9910],
      [52.5410, -1.0000], [52.5560, -1.0200], [52.5730, -1.0430],
      [52.5920, -1.0650], [52.6110, -1.0890], [52.6362, -1.1332]
    ];
    const blockedWest = [
      [52.2840, -1.2050], [52.2910, -1.2250], [52.3000, -1.2470],
      [52.3110, -1.2650], [52.3240, -1.2800], [52.3440, -1.2980],
      [52.3600, -1.3140], [52.3727, -1.3350]
    ];
    const blockedFurtherSouth = [
      [52.2840, -1.2050], [52.2730, -1.1990], [52.2600, -1.1920],
      [52.2460, -1.1880], [52.2300, -1.1830], [52.2120, -1.1770],
      [52.1940, -1.1700]
    ];

    L.polyline(reachableSouth, reachableStyle).addTo(map);
    L.polyline(reachableNorth, reachableStyle).addTo(map);
    L.polyline(welfordArmApproximate, {
      color: "#a76b00", weight: 5, opacity: 0.9, dashArray: "3 8"
    }).bindPopup("Welford Arm: the lock is closed during your trip. The lock location and usable approach are not confirmed here; Welford Basin is beyond the closure.").addTo(map);
    L.polyline(blockedNorth, blockedStyle).addTo(map);
    L.polyline(blockedSouth, blockedStyle).addTo(map);
    L.polyline(blockedLeicester, blockedStyle).addTo(map);
    L.polyline(blockedWest, blockedStyle).addTo(map);
    L.polyline(blockedFurtherSouth, blockedStyle).addTo(map);

    function marker(latlng, title, detail, color, options = {}) {
      const icon = L.divIcon({
        className: "",
        html: `<span style="display:block;width:16px;height:16px;border:3px solid white;border-radius:50%;background:${color};box-shadow:0 1px 5px #333"></span>`,
        iconSize: [16, 16],
        iconAnchor: [8, 8]
      });
      const point = L.marker(latlng, { icon }).addTo(map);
      point.bindTooltip(title, { direction: options.direction || "top", offset: [0, -5] });
      point.bindPopup(`<strong>${title}</strong><br>${detail}`);
      return point;
    }

    function poiMarker(latlng, title, detail, type) {
      const styles = {
        pub: { color: "#7b3fb2", icon: "🍺", label: "Pub / food" },
        shop: { color: "#087e9b", icon: "🛍", label: "Shop" },
        visit: { color: "#d58b00", icon: "🥾", label: "Walk / place to visit" }
      };
      const style = styles[type];
      const icon = L.divIcon({
        className: "",
        html: `<span aria-label="${style.label}" style="display:grid;place-items:center;width:27px;height:27px;border:2px solid white;border-radius:50%;background:${style.color};box-shadow:0 1px 5px #333;font-size:15px;line-height:1">${style.icon}</span>`,
        iconSize: [27, 27],
        iconAnchor: [13, 13]
      });
      const point = L.marker(latlng, { icon }).addTo(map);
      point.bindTooltip(title, { direction: "top", offset: [0, -9] });
      point.bindPopup(`<strong>${title}</strong><br>${detail}`);
      return point;
    }

    marker([52.44505, -1.08021], "North Kilworth Marina", "Pickup at 13:00 Monday; return Friday morning.", "#1769aa", { direction: "right" });
    marker([52.4987, -0.9826], "Foxton Locks — CLOSED", "Northbound boat travel stops here. The Leicester/Market Harborough side is beyond the lock flight.", "#c62828");
    marker([52.43739, -1.07825], "Welford Junction", "The Welford Arm branches off here. Welford Lock is closed during your trip; check how far you can safely cruise and turn.", "#16834a", { direction: "left" });
    marker([52.42247, -1.05391], "Welford Basin — beyond closed lock", "Approximate basin area near the Wharf Inn. Not reachable by boat through Welford Lock during your trip. This marker is not the lock location.", "#c62828");
    marker([52.34846, -1.13717], "Crick", "Village access is near the canal; itinerary moorings are described around Bridges 12–15.", "#16834a", { direction: "left" });
    marker([52.33773, -1.13069], "Crick Tunnel", "Southbound approach; the itinerary suggests turning at Bridge 7 after the tunnel.", "#16834a");
    marker([52.3315, -1.1270], "Bridge 7 — suggested turn", "Itinerary turnaround point within the green reach. Confirm with the marina that it is suitable and accessible.", "#d58b00");
    marker([52.3210, -1.1200], "Watford Locks — CLOSED", "Southbound boat travel cannot pass through the flight.", "#c62828");
    marker([52.47771, -0.92086], "Market Harborough", "Beyond Foxton Locks by boat; the itinerary mentions a towpath walk or taxi as alternatives.", "#c62828");
    marker([52.6362, -1.1332], "Leicester", "North of Foxton on the Grand Union Canal Leicester Section; not reachable through the closed Foxton Locks.", "#c62828", { direction: "right" });
    marker([52.2840, -1.2050], "Braunston Junction", "Approximate junction area: the Grand Union continues south, while the Oxford Canal runs west/northwest toward Rugby.", "#c62828", { direction: "left" });
    marker([52.3727, -1.3350], "Rugby area", "Approximate Oxford Canal corridor west of Braunston; beyond the Watford closure from your hire reach.", "#c62828", { direction: "left" });

    poiMarker([52.50116, -0.98236], "Foxton Locks Inn", "Pub by Foxton Locks. Shore-side visit only from this boat trip while the Foxton flight is closed.", "pub");
    poiMarker([52.50187, -0.97145], "The Black Horse, Foxton", "Pub in Foxton village; allow for the walk from a suitable mooring and check opening times.", "pub");
    poiMarker([52.50448, -0.97022], "Shoulder of Mutton, Foxton", "Pub in Foxton village; confirm food service and opening times.", "pub");
    poiMarker([52.42247, -1.05391], "Wharf Inn, Welford", "Pub near Welford Basin, beyond the closed lock by boat; consider a walk or taxi after checking the route.", "pub");
    poiMarker([52.34670, -1.13627], "The Red Lion, Crick", "Pub on Main Road in Crick.", "pub");
    poiMarker([52.34923, -1.13810], "The Royal Oak, Crick", "Pub on Church Street in Crick.", "pub");
    poiMarker([52.34630, -1.13771], "The Wheatsheaf, Crick (approximate)", "The itinerary lists this pub. Marker is approximate; confirm the address and current opening before walking.", "pub");
    poiMarker([52.34894, -1.12556], "Crick Garden Centre", "Garden centre and café mentioned in the itinerary.", "shop");
    poiMarker([52.3476, -1.1368], "Crick Co-op (approximate)", "The itinerary mentions stocking up at the village Co-op. Approximate village-centre marker; verify location locally.", "shop");
    poiMarker([52.35670, -1.12813], "Cracks Hill", "Walking destination above Crick, noted in the itinerary for its views. Check the route and conditions.", "visit");
    poiMarker([52.47771, -0.92086], "Market Harborough town", "Town visit mentioned in the itinerary. It suggests a towpath walk or taxi from the Foxton area; this is not a boat-access marker.", "visit");
    poiMarker([52.44533, -1.11590], "Kilworth House Hotel", "The itinerary suggests a taxi visit; this is not directly on the canal.", "visit");

    L.circle([52.4987, -0.9826], { radius: 300, color: "#c62828", weight: 2, fillOpacity: 0.08 }).addTo(map);
    L.circle([52.3210, -1.1200], { radius: 300, color: "#c62828", weight: 2, fillOpacity: 0.08 }).addTo(map);

    map.fitBounds([
      [52.185, -1.390],
      [52.655, -0.895]
    ], { padding: [18, 18] });
  </script>
</body>
</html>
